<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="eglobalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#070D1E" stroke="#1E3A8A" stroke-width="2"/>
  
  <!-- Outer Hexagon Frame -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="none" stroke="#2563EB" stroke-width="2.5"/>
  
  <!-- Vertex Nodes -->
  <circle cx="50" cy="15" r="3" fill="#38BDF8"/>
  <circle cx="80" cy="32" r="3" fill="#38BDF8"/>
  <circle cx="80" cy="68" r="3" fill="#38BDF8"/>
  <circle cx="50" cy="85" r="3" fill="#38BDF8"/>
  <circle cx="20" cy="68" r="3" fill="#38BDF8"/>
  <circle cx="20" cy="32" r="3" fill="#38BDF8"/>
  
  <!-- Geometric Cube / Connector lines -->
  <line x1="50" y1="15" x2="50" y2="85" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="20" y1="32" x2="80" y2="68" stroke="#1D4ED8" stroke-width="1"/>
  <line x1="20" y1="68" x2="80" y2="32" stroke="#1D4ED8" stroke-width="1"/>
  
  <!-- Central Arrow / Crystal Emblem -->
  <path d="M50 25 L65 52 L57 52 L57 73 L43 73 L43 52 L35 52 Z" fill="url(#cyanGlow)" opacity="0.95"/>
  <path d="M50 32 L58 48 L50 44 L42 48 Z" fill="#FFFFFF"/>
</svg>
